<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Super Slasher 5000</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  html,body{margin:0;height:100%;background:#120a10;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Courier New",monospace}
  canvas{background:#000;max-width:100vw;max-height:100vh;width:min(100vw,177.78vh);aspect-ratio:16/9;image-rendering:pixelated;cursor:default;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{max-height:100dvh;width:min(100vw,177.78dvh)}
  #rot{display:none;position:fixed;top:0;left:0;right:0;padding:6px;text-align:center;color:#ffe14a;background:rgba(18,10,16,.8);font-size:13px;pointer-events:none;z-index:2}
  @media (pointer:coarse) and (orientation:portrait){#rot{display:block}}
</style>
</head>
<body>
<div id="rot">ROTATE YOUR PHONE SIDEWAYS (landscape)</div>
<canvas id="c" width="960" height="540"></canvas>
<input id="nm" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="NAME" style="display:none;position:fixed;z-index:3;box-sizing:border-box;border:0;outline:0;margin:0;padding:0 8px;text-align:center;background:#1f1018;color:#efe3cf;font-family:'Courier New',monospace;font-weight:bold;border-radius:0">
<!-- load order matters: three.js -> art (palettes/textures) -> sprites -> world (level) -> game (logic/menus) -> intro (cutscene) -->
<script src="three.min.js"></script>
<script src="art.js"></script>
<script src="sprites.js"></script>
<script src="world.js"></script>
<script src="game.js"></script>
<script src="music.js"></script>
<script src="intro.js"></script>
<script src="store.js"></script>
<script>boot();</script>
</body>
</html>
